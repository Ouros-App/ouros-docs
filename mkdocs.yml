      - Fluxos de dados: architecture/data-flow.md
      - Topologia de deploy: architecture/deployment-topology.md
      - Decisões observadas: architecture/decisions.md
      - Lacunas atuais: architecture/current-gaps.md
  - Repositórios:
      - Catálogo: repositories/index.md
      - Serviços:
          - Spring API: repositories/services/ms-spring-api.md
          - Auth Service: repositories/services/ms-auth-service.md
          - Keycloak: repositories/services/ouros-keycloak.md
          - AI Server: repositories/services/ms-ai-server.md
          - Knowledge MCP: repositories/services/ms-mcp-server-ouros-knowledge.md
          - Knowledge MCP Code Mode: repositories/services/ms-mcp-server-ouros-knowledge-codemode.md
          - Telemetry Dashboard: repositories/services/ms-telemetry-dashboard-service.md
      - Dados:
          - PostgreSQL Prod: repositories/data/postgres-segundo-prod-database.md
          - PostgreSQL QA: repositories/data/postgres-segundo-qa-database.md
          - Analytics DB: repositories/data/ouros-analytics-database.md
          - MongoDB AI Prod: repositories/data/mongodb-ai-prod-database.md
          - MongoDB AI QA: repositories/data/mongodb-ai-qa-database.md
      - Clientes:
